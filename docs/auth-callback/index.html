<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Opening OneLoop UIv2…</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0a0c10;
      color: #e8eef8;
      text-align: center;
      padding: 24px;
    }
    a { color: #4d8bff; }
    .muted { color: #9aa6b8; font-size: 14px; margin-top: 12px; }
  </style>
  <script>
    (function () {
      // Supabase may return tokens in the query (PKCE) or hash (implicit).
      var search = window.location.search || "";
      var hash = window.location.hash || "";
      var target = "oneloopuiv2://auth-callback" + search + hash;

      // Hand off to the iOS app. ASWebAuthenticationSession will capture this
      // custom scheme and close the in-app browser.
      window.location.replace(target);

      window.addEventListener("DOMContentLoaded", function () {
        var link = document.getElementById("open-link");
        var fallback = document.getElementById("fallback");
        if (link) link.href = target;
        setTimeout(function () {
          if (fallback) fallback.style.display = "block";
        }, 900);
      });
    })();
  </script>
</head>
<body>
  <div>
    <h1>Opening OneLoop UIv2…</h1>
    <p class="muted">Finishing sign-in and returning to the app.</p>
    <p id="fallback" style="display:none">
      <a id="open-link">Tap here if OneLoop UIv2 doesn’t open</a>
    </p>
  </div>
</body>
</html>
